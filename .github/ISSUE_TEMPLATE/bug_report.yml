name: Bug report
description: Something in Lime doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please don't attach personal photos or documents; a small test file is best.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drag a .heic file from Finder
        2. Tap Shift
        3. Drop it on PNG
    validations:
      required: true
  - type: input
    id: lime
    attributes:
      label: Lime version
      description: Shown in Settings, or under Lime.app → Get Info.
      placeholder: "1.1.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: style
    attributes:
      label: Wheel style
      options: [Liquid, Frosted, Solid, Not sure]
  - type: input
    id: files
    attributes:
      label: File type and size
      description: For conversion or tool problems.
      placeholder: "HEIC, 3 MB"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or a screen recording help a lot.
